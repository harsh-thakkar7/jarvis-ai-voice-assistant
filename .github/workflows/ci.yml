name: jarvis-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (macos-14)
    runs-on: macos-14
    env:
      JARVIS_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # v5 supports 3.14; if unavailable, pin to "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile-check legacy scripts (non-blocking)
        run: |
          python -m compileall -q *.py || true

      - name: Run test suite (headless)
        run: |
          python -m pytest tests/ -q --maxfail=20

      - name: Upload jarvis.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-log
          path: jarvis.log
          if-no-files-found: ignore

  lint:
    name: lint (real errors only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff real-errors-only check
        run: |
          ruff check code_brain_pro.py code_validator.py file_power.py power_skills.py deepthink.py web_dev_brain.py app_dev_brain.py calendar_music_skills.py mail_skills.py live_screen_brain.py journal_brain.py data_file_tools.py memory_core.py security_hardening.py streaming_tts.py agent_loop.py --select E9,F63,F7,F82
